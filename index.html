<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;

    header {

      background: #171725;

<body>

    <h1>CREATOR HUB</h1>

  <section>

    <a class="button"
       href="https://www.youtube.com/"
       target="_blank">
       WATCH ON YOUTUBE
    </a>
  </section>

  <section>
    <h2>Latest Videos</h2>

  </section>

  <footer>

</html>
